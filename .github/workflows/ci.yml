name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot-local-only
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://copilot:copilot-local-only@127.0.0.1:5432/copilot_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests scripts evals/retrieval
      - run: uv run --frozen ruff format --check src tests scripts evals/retrieval
      - run: uv run --frozen pytest -q
      - run: docker build -f services/knowledge-api/Dockerfile -t support-copilot-knowledge:ci .
      - run: docker build -f services/mock-backend/Dockerfile -t support-copilot-backend:ci .
      - run: docker build -f services/support-agent/Dockerfile -t support-copilot-agent:ci .

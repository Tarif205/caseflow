[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caseflow"
version = "0.1.0"
description = "Tenant-isolated RAG and support agent for fictional Northwind Outfitters"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "fastembed==0.9.0",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "langfuse==5.0.4",
  "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
caseflow = "caseflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caseflow"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
markers = ["integration: requires a local Postgres database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
